<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Relay</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:#0f172a;color:#e2e8f0;padding:10px}
.grid{display:grid;grid-template-columns:350px 1fr;gap:10px;height:calc(100vh - 20px)}
.sidebar{display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.card{background:#1e293b;border-radius:8px;padding:12px}
h2{font-size:0.9rem;color:#94a3b8;margin-bottom:8px}
.status{display:inline-block;padding:2px 8px;border-radius:4px;font-size:0.75rem}
.on{background:#166534;color:#86efac}
.off{background:#991b1b;color:#fca5a5}
.wait{background:#854d0e;color:#fde047}
input,button{padding:6px 10px;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:0.85rem}
button{background:#2563eb;border-color:#2563eb;cursor:pointer}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
#log{background:#020617;border-radius:4px;padding:8px;height:100px;overflow-y:auto;font-family:monospace;font-size:0.7rem}
.i{color:#38bdf8}.s{color:#4ade80}.e{color:#f87171}
#chat{background:#020617;padding:8px;height:80px;overflow-y:auto;font-size:0.85rem}
.room-code{font-size:1.8rem;font-family:monospace;letter-spacing:0.2em;color:#38bdf8;font-weight:bold}
.small{font-size:0.75rem;color:#64748b}
.browser{background:#1e293b;border-radius:8px;display:flex;flex-direction:column}
.browser-bar{padding:10px;border-bottom:1px solid #334155;display:flex;gap:8px}
.browser-bar input{flex:1}
#browserFrame{flex:1;background:#fff;border-radius:0 0 8px 8px;border:none}
#browserContent{flex:1;background:#0f172a;padding:15px;overflow:auto;font-family:monospace;font-size:0.8rem;white-space:pre-wrap;color:#e2e8f0}
@media(max-width:900px){.grid{grid-template-columns:1fr;height:auto}.browser{height:400px}}
</style>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
<div class="grid">
<div class="sidebar">
<div class="card">
<h2>Backend (VM only) <span id="backendStatus" class="status off">Off</span></h2>
<div class="row">
<input id="backend" value="ws://127.0.0.1:9999" style="flex:1">
<button id="btnBackend">Connect</button>
</div>
</div>

<div class="card">
<h2>Room <span id="status" class="status off">Offline</span></h2>
<div class="row">
<input id="room" placeholder="CODE" maxlength="4" style="width:80px;text-transform:uppercase;text-align:center">
<button id="btnJoin">Join</button>
<button id="btnNew">New</button>
</div>
<div id="roomDisplay" style="display:none;margin-top:10px;text-align:center">
<div id="roomCode" class="room-code"></div>
<div class="small">Peer: <span id="peerStatus" class="status off">Waiting</span></div>
</div>
</div>

<div class="card">
<h2>Chat</h2>
<div id="chat"></div>
<div class="row">
<input id="msg" placeholder="Message..." style="flex:1" disabled>
<button id="btnSend" disabled>Send</button>
</div>
</div>

<div class="card">
<h2>Log</h2>
<div id="log"></div>
</div>
</div>

<div class="browser">
<div class="browser-bar">
<button id="btnBack" disabled>&lt;</button>
<input id="url" placeholder="http://example.com/" disabled>
<button id="btnGo" disabled>Go</button>
</div>
<div id="browserContent">Enter room code to connect, then browse through the tunnel.</div>
</div>
</div>

<script>
let peer,conn,room,backend;
let fetchId=0,pendingFetch={};

const log=(m,t='i')=>{const e=document.getElementById('log');e.innerHTML+=`<div class="${t}">${new Date().toLocaleTimeString().substr(0,5)} ${m}</div>`;e.scrollTop=e.scrollHeight};
const setStatus=(id,s,t)=>{const e=document.getElementById(id);e.className='status '+(s?'on':s===null?'wait':'off');if(t)e.textContent=t};
const genCode=()=>Array(4).fill().map(()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');

function connectBackend(){
const url=document.getElementById('backend').value;
try{
backend=new WebSocket(url);
backend.onopen=()=>{log('Backend on','s');setStatus('backendStatus',true,'On')};
backend.onclose=()=>{setStatus('backendStatus',false,'Off');backend=null};
backend.onmessage=e=>{
const m=JSON.parse(e.data);
if(m.type==='fetch_response'){
if(pendingFetch[m.id]){pendingFetch[m.id](m);delete pendingFetch[m.id]}
if(conn&&conn.open)conn.send(m);
}
};
}catch(e){log('Backend err','e')}
}

function initPeer(id,isHost){
peer=new Peer(id,{debug:0});
peer.on('open',pid=>{
log('Online','s');
setStatus('status',true,'Online');
document.getElementById('roomCode').textContent=room;
document.getElementById('roomDisplay').style.display='block';
if(!isHost){
log('Joining...');
setStatus('peerStatus',null,'...');
conn=peer.connect('relay-'+room+'-host',{reliable:true});
setupConn();
}
});
peer.on('connection',c=>{log('Peer joined','s');conn=c;setupConn()});
peer.on('error',e=>{
if(e.type==='peer-unavailable')setStatus('peerStatus',false,'Not found');
else if(e.type==='unavailable-id'){initPeer('relay-'+room+'-'+genCode(),false)}
});
}

function setupConn(){
conn.on('open',()=>{
log('Connected!','s');
setStatus('peerStatus',true,'Connected');
document.getElementById('msg').disabled=false;
document.getElementById('btnSend').disabled=false;
document.getElementById('url').disabled=false;
document.getElementById('btnGo').disabled=false;
});
conn.on('data',d=>{
if(d.type==='chat')document.getElementById('chat').innerHTML+=`<div><b>P:</b> ${d.text}</div>`;
else if(d.type==='fetch_request'&&backend&&backend.readyState===1){
log('Fetch: '+d.url.substr(0,30));
backend.send(JSON.stringify(d));
}
else if(d.type==='fetch_response'){
if(pendingFetch[d.id]){pendingFetch[d.id](d);delete pendingFetch[d.id]}
}
});
conn.on('close',()=>{setStatus('peerStatus',false,'Disconnected')});
}

function fetchUrl(url){
return new Promise((resolve)=>{
const id='f'+(fetchId++);
pendingFetch[id]=resolve;
const msg={type:'fetch_request',id:id,url:url};
if(backend&&backend.readyState===1){
backend.send(JSON.stringify(msg));
}else if(conn&&conn.open){
conn.send(msg);
}else{
resolve({error:'No connection'});
}
setTimeout(()=>{if(pendingFetch[id]){resolve({error:'Timeout'});delete pendingFetch[id]}},30000);
});
}

async function browse(){
const url=document.getElementById('url').value.trim();
if(!url)return;
document.getElementById('browserContent').textContent='Loading...';
const resp=await fetchUrl(url);
if(resp.error){
document.getElementById('browserContent').innerHTML=`<span style="color:#f87171">Error: ${resp.error}</span>`;
}else{
document.getElementById('browserContent').textContent=resp.body||'(empty response)';
}
}

document.getElementById('btnBackend').onclick=connectBackend;
document.getElementById('btnNew').onclick=()=>{room=genCode();document.getElementById('room').value=room;setStatus('peerStatus',null,'Waiting');initPeer('relay-'+room+'-host',true)};
document.getElementById('btnJoin').onclick=()=>{room=document.getElementById('room').value.trim().toUpperCase();if(room.length>=4)initPeer('relay-'+room+'-host',true)};
document.getElementById('room').onkeypress=e=>{if(e.key==='Enter')document.getElementById('btnJoin').click()};
document.getElementById('btnSend').onclick=()=>{const m=document.getElementById('msg').value.trim();if(m&&conn&&conn.open){conn.send({type:'chat',text:m});document.getElementById('chat').innerHTML+=`<div><b>You:</b> ${m}</div>`;document.getElementById('msg').value=''}};
document.getElementById('msg').onkeypress=e=>{if(e.key==='Enter')document.getElementById('btnSend').click()};
document.getElementById('btnGo').onclick=browse;
document.getElementById('url').onkeypress=e=>{if(e.key==='Enter')browse()};

log('VM: Connect backend, New room');
log('Host: Enter code, Join');
</script>
</body>
</html>
