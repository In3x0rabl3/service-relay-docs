<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Relay</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:#1a1a1a;color:#ccc;font-size:13px}
.wrap{display:flex;height:100vh}
.side{width:280px;border-right:1px solid #333;padding:15px;overflow-y:auto}
.main{flex:1;display:flex;flex-direction:column;background:#111}
.section{margin-bottom:20px}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#666;margin-bottom:8px}
.row{display:flex;gap:8px;margin-bottom:8px}
input,button{padding:6px 10px;border:1px solid #333;background:#222;color:#ccc;border-radius:3px;font-size:12px}
input:focus{outline:none;border-color:#555}
button{cursor:pointer;background:#333}
button:hover{background:#444}
button:disabled{opacity:0.4;cursor:default}
.status{font-size:11px;padding:2px 6px;border-radius:2px;background:#333}
.status.on{background:#1a3a1a;color:#6a6}
.status.off{background:#3a1a1a;color:#a66}
.room-code{font-family:monospace;font-size:20px;letter-spacing:4px;color:#fff;margin:10px 0}
#log{background:#111;border:1px solid #333;border-radius:3px;padding:8px;height:100px;overflow-y:auto;font-family:monospace;font-size:11px;color:#666}
#chat{background:#111;border:1px solid #333;border-radius:3px;padding:8px;height:80px;overflow-y:auto;font-size:12px}
.bar{padding:10px 15px;border-bottom:1px solid #333;display:flex;gap:8px;background:#1a1a1a}
.bar input{flex:1;background:#111}
#content{flex:1;padding:15px;overflow:auto;font-family:monospace;font-size:12px;white-space:pre-wrap;background:#0a0a0a;color:#888}
.info{color:#668}.ok{color:#686}.err{color:#866}
</style>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
</head>
<body>
<div class="wrap">
<div class="side">

<div class="section">
<div class="section-title">Backend</div>
<div class="row">
<input id="backend" value="ws://127.0.0.1:9999" style="flex:1">
<button id="btnBackend">Connect</button>
</div>
<div style="margin-top:4px">Status: <span id="backendStatus" class="status off">off</span></div>
</div>

<div class="section">
<div class="section-title">Room</div>
<div class="row">
<input id="room" placeholder="CODE" maxlength="4" style="width:70px;text-transform:uppercase;text-align:center;font-family:monospace">
<button id="btnJoin">Join</button>
<button id="btnNew">New</button>
</div>
<div id="roomInfo" style="display:none">
<div class="room-code" id="roomCode"></div>
<div>Peer: <span id="peerStatus" class="status off">waiting</span></div>
</div>
<div style="margin-top:8px">Signal: <span id="status" class="status off">offline</span></div>
</div>

<div class="section">
<div class="section-title">Chat</div>
<div id="chat"></div>
<div class="row" style="margin-top:8px">
<input id="msg" placeholder="message" style="flex:1" disabled>
<button id="btnSend" disabled>Send</button>
</div>
</div>

<div class="section">
<div class="section-title">Log</div>
<div id="log"></div>
</div>

</div>

<div class="main">
<div class="bar">
<input id="url" placeholder="http://example.com" disabled>
<button id="btnGo" disabled>Fetch</button>
</div>
<div id="content">Connect to a room to browse through the tunnel.</div>
</div>
</div>

<script>
(function(){
let peer,conn,room,backend,fetchId=0,pending={};
const $=id=>document.getElementById(id);
const log=(m,c='info')=>{const e=$('log');const t=new Date().toTimeString().substr(0,5);e.innerHTML+='<div class="'+c+'">'+t+' '+m+'</div>';e.scrollTop=e.scrollHeight};
const setStatus=(id,on,t)=>{const e=$(id);e.className='status '+(on?'on':'off');e.textContent=t||(on?'on':'off')};

function connectBackend(){
const url=$('backend').value;
try{
backend=new WebSocket(url);
backend.onopen=()=>{log('backend connected','ok');setStatus('backendStatus',true,'on')};
backend.onclose=()=>{setStatus('backendStatus',false,'off');backend=null};
backend.onmessage=e=>{
const m=JSON.parse(e.data);
if(m.type==='fetch_response'){
if(pending[m.id]){pending[m.id](m);delete pending[m.id]}
if(conn&&conn.open)conn.send(m);
}
};
}catch(e){log('backend error: '+e,'err')}
}

function initPeer(id,host){
if(typeof Peer==='undefined'){log('PeerJS not loaded','err');return}
log('connecting...');
try{
peer=new Peer(id,{debug:0});
}catch(e){log('peer init error: '+e,'err');return}

peer.on('open',function(){
log('online','ok');
setStatus('status',true,'online');
$('roomCode').textContent=room;
$('roomInfo').style.display='block';
if(!host){
setStatus('peerStatus',false,'connecting');
conn=peer.connect('relay-'+room+'-host',{reliable:true});
setupConn();
}
});
peer.on('connection',function(c){log('peer joined','ok');conn=c;setupConn()});
peer.on('error',function(e){
log('error: '+e.type,'err');
if(e.type==='peer-unavailable')setStatus('peerStatus',false,'not found');
else if(e.type==='unavailable-id')initPeer('relay-'+room+'-'+Math.random().toString(36).substr(2,4),false);
});
}

function setupConn(){
conn.on('open',function(){
log('connected','ok');
setStatus('peerStatus',true,'connected');
$('msg').disabled=false;
$('url').disabled=false;
$('btnSend').disabled=false;
$('btnGo').disabled=false;
});
conn.on('data',function(d){
if(d.type==='chat')$('chat').innerHTML+='<div>'+d.text+'</div>';
else if(d.type==='fetch_request'&&backend&&backend.readyState===1)backend.send(JSON.stringify(d));
else if(d.type==='fetch_response'&&pending[d.id]){pending[d.id](d);delete pending[d.id]}
});
conn.on('close',function(){log('disconnected','err');setStatus('peerStatus',false,'disconnected')});
}

function fetchUrl(url){
return new Promise(function(r){
var id='f'+(fetchId++);
pending[id]=r;
var msg={type:'fetch_request',id:id,url:url};
if(backend&&backend.readyState===1)backend.send(JSON.stringify(msg));
else if(conn&&conn.open)conn.send(msg);
else r({error:'no connection'});
setTimeout(function(){if(pending[id]){r({error:'timeout'});delete pending[id]}},30000);
});
}

function browse(){
var url=$('url').value.trim();
if(!url)return;
$('content').textContent='Loading...';
fetchUrl(url).then(function(r){
$('content').textContent=r.error?'Error: '+r.error:r.body||'(empty)';
});
}

function gen(){return Array(4).fill().map(function(){return'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]}).join('')}

$('btnBackend').onclick=connectBackend;
$('btnNew').onclick=function(){room=gen();$('room').value=room;setStatus('peerStatus',false,'waiting');initPeer('relay-'+room+'-host',true)};
$('btnJoin').onclick=function(){room=$('room').value.trim().toUpperCase();if(room.length>=4){log('joining '+room);initPeer('relay-'+room+'-host',true)}else{log('enter 4 char code','err')}};
$('room').onkeypress=function(e){if(e.key==='Enter')$('btnJoin').click()};
$('btnSend').onclick=function(){var m=$('msg').value.trim();if(m&&conn&&conn.open){conn.send({type:'chat',text:m});$('chat').innerHTML+='<div style="color:#888">you: '+m+'</div>';$('msg').value=''}};
$('msg').onkeypress=function(e){if(e.key==='Enter')$('btnSend').click()};
$('btnGo').onclick=browse;
$('url').onkeypress=function(e){if(e.key==='Enter')browse()};

setTimeout(function(){
if(typeof Peer==='undefined'){log('PeerJS failed to load - CDN may be blocked','err')}else{log('ready')}
},1500);
})();
</script>
</body>
</html>
