<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Relay</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:#1a1a1a;color:#ccc;font-size:13px}
.wrap{display:flex;height:100vh}
.side{width:280px;border-right:1px solid #333;padding:15px;overflow-y:auto}
.main{flex:1;display:flex;flex-direction:column;background:#111}
.section{margin-bottom:20px}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#666;margin-bottom:8px}
.row{display:flex;gap:8px;margin-bottom:8px}
input,button{padding:6px 10px;border:1px solid #333;background:#222;color:#ccc;border-radius:3px;font-size:12px}
button{cursor:pointer;background:#333}
button:hover{background:#444}
button:disabled{opacity:0.4}
.status{font-size:11px;padding:2px 6px;border-radius:2px;background:#333}
.status.on{background:#1a3a1a;color:#6a6}
.status.off{background:#3a1a1a;color:#a66}
.room-code{font-family:monospace;font-size:20px;letter-spacing:4px;color:#fff;margin:10px 0}
#log{background:#111;border:1px solid #333;border-radius:3px;padding:8px;height:120px;overflow-y:auto;font-family:monospace;font-size:11px;color:#666}
#chat{background:#111;border:1px solid #333;border-radius:3px;padding:8px;height:80px;overflow-y:auto;font-size:12px}
.bar{padding:10px 15px;border-bottom:1px solid #333;display:flex;gap:8px;background:#1a1a1a}
.bar input{flex:1;background:#111}
#content{flex:1;padding:15px;overflow:auto;font-family:monospace;font-size:12px;white-space:pre-wrap;background:#0a0a0a;color:#888}
</style>
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
</head>
<body>
<div class="wrap">
<div class="side">
<div class="section">
<div class="section-title">Backend</div>
<div class="row">
<input id="backend" value="ws://127.0.0.1:9999" style="flex:1">
<button id="btnBackend">Connect</button>
</div>
<div style="margin-top:4px">Status: <span id="backendStatus" class="status off">off</span></div>
</div>

<div class="section">
<div class="section-title">Room</div>
<div class="row">
<input id="room" placeholder="CODE" maxlength="8" style="width:80px;text-transform:uppercase;text-align:center;font-family:monospace">
<button id="btnJoin">Join</button>
<button id="btnNew">New</button>
</div>
<div id="roomInfo" style="display:none">
<div class="room-code" id="roomCode"></div>
<div>Peer: <span id="peerStatus" class="status off">waiting</span></div>
</div>
<div style="margin-top:8px">Signal: <span id="status" class="status off">offline</span></div>
</div>

<div class="section">
<div class="section-title">Chat</div>
<div id="chat"></div>
<div class="row" style="margin-top:8px">
<input id="msg" placeholder="message" style="flex:1" disabled>
<button id="btnSend" disabled>Send</button>
</div>
</div>

<div class="section">
<div class="section-title">Log</div>
<div id="log"></div>
</div>
</div>

<div class="main">
<div class="bar">
<input id="url" placeholder="http://example.com" disabled>
<button id="btnGo" disabled>Fetch</button>
</div>
<div id="content">Connect to room to browse via tunnel.</div>
</div>
</div>

<script>
var room,ably,channel,backend,pending={},fid=0,myId,peerId=null,connected=false;
var $=function(i){return document.getElementById(i)};
var log=function(m,c){$('log').innerHTML+='<div style="color:'+(c||'#666')+'">'+new Date().toTimeString().substr(0,5)+' '+m+'</div>';$('log').scrollTop=9999};
var setS=function(i,on,t){var e=$(i);e.className='status '+(on?'on':'off');e.textContent=t||(on?'on':'off')};

function connectBackend(){
try{
backend=new WebSocket($('backend').value);
backend.onopen=function(){log('backend ok','#6a6');setS('backendStatus',1,'on')};
backend.onclose=function(){setS('backendStatus',0,'off');backend=null};
backend.onmessage=function(e){
var m=JSON.parse(e.data);
if(m.type==='fetch_response'){
// Handle locally if we have pending request
if(pending[m.id]){pending[m.id](m);delete pending[m.id];}
// Forward to peer via Ably
else if(channel&&peerId){
channel.publish('data',{type:'response',from:myId,id:m.id,body:m.body,error:m.error});
}
}
};
}catch(e){log('backend err','#a66')}
}

function setConnected(){
if(connected)return;
connected=true;
log('peer connected','#6a6');
setS('peerStatus',1,'connected');
$('msg').disabled=$('url').disabled=$('btnSend').disabled=$('btnGo').disabled=false;
}

function joinRoom(code,isNew){
room=code.toUpperCase();
myId=Math.random().toString(36).substr(2,8);
connected=false;
$('room').value=room;
$('roomCode').textContent=room;
$('roomInfo').style.display='block';

log('connecting...');

ably = new Ably.Realtime({
key: 'gAgqHA.yZ5GzA:6o4_ysot75A7YNoDEicN23KmBcI3isDJL3uYIUp3Ibg',
clientId: myId
});

ably.connection.on('connected', function(){
log('online','#6a6');
setS('status',1,'online');

channel = ably.channels.get('relay-'+room);
channel.subscribe(function(msg){
var d=msg.data;
if(!d||d.from===myId)return;

if(d.type==='hello'&&!connected){
peerId=d.from;
setConnected();
// Only respond if we were waiting (isNew)
if(isNew)channel.publish('data',{type:'hello',from:myId});
}
else if(d.type==='chat'){
$('chat').innerHTML+='<div>'+d.text+'</div>';
}
else if(d.type==='fetch'){
// Peer wants us to fetch a URL
if(backend&&backend.readyState===1){
backend.send(JSON.stringify({type:'fetch_request',id:d.id,url:d.url}));
}else{
channel.publish('data',{type:'response',from:myId,id:d.id,error:'no backend'});
}
}
else if(d.type==='response'){
// Got response from peer's fetch
if(pending[d.id]){pending[d.id](d);delete pending[d.id];}
}
});

channel.on('attached',function(){
if(isNew){
log('waiting...');
setS('peerStatus',0,'waiting');
}else{
log('joining...');
channel.publish('data',{type:'hello',from:myId});
}
});
});

ably.connection.on('failed', function(){log('failed','#a66');setS('status',0,'failed')});
}

function sendChat(text){
if(!channel||!peerId)return;
channel.publish('data',{type:'chat',from:myId,text:text});
$('chat').innerHTML+='<div style="color:#888">you: '+text+'</div>';
}

function browse(){
var u=$('url').value.trim();if(!u)return;
$('content').textContent='Loading...';
var id='f'+(fid++);
pending[id]=function(r){$('content').textContent=r.error?'Error: '+r.error:r.body||'(empty)'};

if(backend&&backend.readyState===1){
backend.send(JSON.stringify({type:'fetch_request',id:id,url:u}));
}else if(channel&&peerId){
channel.publish('data',{type:'fetch',from:myId,id:id,url:u});
}else{
$('content').textContent='Not connected';
}
}

var gen=function(){return'XXXX'.replace(/X/g,function(){return'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]})};

$('btnBackend').onclick=connectBackend;
$('btnNew').onclick=function(){joinRoom(gen(),true)};
$('btnJoin').onclick=function(){var c=$('room').value.trim();if(c.length>=4)joinRoom(c,false);else log('enter code','#a66')};
$('room').onkeypress=function(e){if(e.key==='Enter')$('btnJoin').click()};
$('btnSend').onclick=function(){var m=$('msg').value.trim();if(m){sendChat(m);$('msg').value=''}};
$('msg').onkeypress=function(e){if(e.key==='Enter')$('btnSend').click()};
$('btnGo').onclick=browse;
$('url').onkeypress=function(e){if(e.key==='Enter')browse()};

log('ready');
</script>
</body>
</html>
