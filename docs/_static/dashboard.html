<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Relay</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:#0f172a;color:#e2e8f0;padding:20px}
.card{background:#1e293b;border-radius:8px;padding:15px;margin-bottom:15px;max-width:600px}
h2{font-size:1rem;color:#94a3b8;margin-bottom:10px}
.status{display:inline-block;padding:4px 12px;border-radius:4px;font-size:0.85rem}
.on{background:#166534;color:#86efac}
.off{background:#991b1b;color:#fca5a5}
.wait{background:#854d0e;color:#fde047}
input,button{padding:8px 12px;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:0.9rem}
button{background:#2563eb;border-color:#2563eb;cursor:pointer}
.row{display:flex;gap:10px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
#log{background:#020617;border-radius:4px;padding:10px;height:150px;overflow-y:auto;font-family:monospace;font-size:0.8rem}
.i{color:#38bdf8}.s{color:#4ade80}.e{color:#f87171}
#chat{background:#020617;padding:10px;height:100px;overflow-y:auto;margin-bottom:10px;font-size:0.9rem}
.room-code{font-size:2.5rem;font-family:monospace;letter-spacing:0.3em;color:#38bdf8;font-weight:bold}
.small{font-size:0.8rem;color:#64748b}
</style>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
<div class="card">
<h2>Connection <span id="status" class="status off">Offline</span></h2>
<div class="row">
<input id="room" placeholder="4-char code" maxlength="4" style="width:120px;text-transform:uppercase;font-size:1.2rem;text-align:center">
<button id="btnJoin">Join</button>
<button id="btnNew">New Room</button>
</div>
<div id="roomDisplay" style="display:none;margin-top:15px;text-align:center">
<div class="small">YOUR ROOM CODE</div>
<div id="roomCode" class="room-code"></div>
<div class="small" style="margin-top:10px">Peer: <span id="peerStatus" class="status off">Waiting...</span></div>
</div>
</div>

<div class="card">
<h2>Chat</h2>
<div id="chat"></div>
<div class="row">
<input id="msg" placeholder="Type message..." style="flex:1" disabled>
<button id="btnSend" disabled>Send</button>
</div>
</div>

<div class="card">
<h2>TCP Proxy (via peer with backend)</h2>
<div class="row">
<input id="target" placeholder="host:port" style="flex:1">
<button id="btnConn" disabled>Connect</button>
</div>
<div class="row">
<input id="data" placeholder="Data..." style="flex:1" disabled>
<button id="btnData" disabled>Send</button>
</div>
<div id="resp" style="background:#020617;padding:10px;margin-top:10px;font-family:monospace;font-size:0.75rem;max-height:80px;overflow-y:auto;white-space:pre-wrap"></div>
</div>

<div class="card">
<h2>Log</h2>
<div id="log"></div>
</div>

<script>
let peer,conn,room;
const log=(m,t='i')=>{const e=document.getElementById('log');e.innerHTML+=`<div class="${t}">${new Date().toLocaleTimeString()} ${m}</div>`;e.scrollTop=e.scrollHeight};
const setStatus=(id,s,t)=>{const e=document.getElementById(id);e.className='status '+(s?'on':s===null?'wait':'off');if(t)e.textContent=t};
const genCode=()=>Array(4).fill().map(()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');

function initPeer(id, isHost){
peer=new Peer(id,{debug:0});
peer.on('open',pid=>{
log('Connected as: '+pid,'s');
setStatus('status',true,'Online');
document.getElementById('roomCode').textContent=room;
document.getElementById('roomDisplay').style.display='block';
if(!isHost){
// Join existing room - connect to host
const hostId='relay-'+room+'-host';
log('Connecting to host...');
setStatus('peerStatus',null,'Connecting...');
conn=peer.connect(hostId,{reliable:true});
setupConn();
}
});
peer.on('connection',c=>{
log('Peer connected!','s');
conn=c;
setupConn();
});
peer.on('error',e=>{
if(e.type==='peer-unavailable'){log('Room not found or host offline','e');setStatus('peerStatus',false,'Not found')}
else if(e.type==='unavailable-id'){log('Room already exists, joining...','i');initPeer('relay-'+room+'-guest',false)}
else{log('Error: '+e.type,'e')}
});
}

function setupConn(){
conn.on('open',()=>{
log('Channel open','s');
setStatus('peerStatus',true,'Connected');
document.getElementById('msg').disabled=false;
document.getElementById('btnSend').disabled=false;
document.getElementById('btnConn').disabled=false;
});
conn.on('data',d=>{
if(d.type==='chat')document.getElementById('chat').innerHTML+=`<div><b>Peer:</b> ${d.text}</div>`;
else if(d.type==='tcp_ok'){log('TCP connected','s');document.getElementById('btnData').disabled=false}
else if(d.type==='tcp_data')document.getElementById('resp').textContent+=atob(d.data);
else if(d.type==='tcp_close')log('TCP closed');
else if(d.type==='tcp_err')log('TCP error: '+d.msg,'e');
});
conn.on('close',()=>{log('Peer disconnected','e');setStatus('peerStatus',false,'Disconnected')});
}

function createRoom(){
room=genCode();
document.getElementById('room').value=room;
log('Creating room '+room+'...');
setStatus('peerStatus',null,'Waiting for peer...');
initPeer('relay-'+room+'-host',true);
}

function joinRoom(){
room=document.getElementById('room').value.trim().toUpperCase();
if(room.length<4){log('Enter 4-char code','e');return}
log('Joining room '+room+'...');
initPeer('relay-'+room+'-host',true);
}

document.getElementById('btnNew').onclick=createRoom;
document.getElementById('btnJoin').onclick=joinRoom;
document.getElementById('room').onkeypress=e=>{if(e.key==='Enter')joinRoom()};
document.getElementById('btnSend').onclick=()=>{
const m=document.getElementById('msg').value.trim();
if(m&&conn&&conn.open){
conn.send({type:'chat',text:m});
document.getElementById('chat').innerHTML+=`<div><b>You:</b> ${m}</div>`;
document.getElementById('msg').value='';
}
};
document.getElementById('msg').onkeypress=e=>{if(e.key==='Enter')document.getElementById('btnSend').click()};
document.getElementById('btnConn').onclick=()=>{
const t=document.getElementById('target').value.trim();if(!t)return;
const[h,p]=t.split(':');const s=Math.random().toString(36).substr(2,6);
document.getElementById('resp').textContent='';
document.getElementById('data').dataset.session=s;
document.getElementById('data').disabled=false;
if(conn&&conn.open)conn.send({type:'tcp_connect',host:h,port:parseInt(p)||80,session:s});
};
document.getElementById('btnData').onclick=()=>{
const d=document.getElementById('data').value;const s=document.getElementById('data').dataset.session;
if(d&&s&&conn&&conn.open)conn.send({type:'tcp_send',session:s,data:btoa(d)});
};

log('Click "New Room" or enter code and "Join"');
</script>
</body>
</html>
