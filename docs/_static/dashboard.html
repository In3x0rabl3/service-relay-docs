<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Relay</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:#1a1a1a;color:#ccc;font-size:13px}
.wrap{display:flex;height:100vh}
.side{width:260px;border-right:1px solid #333;padding:15px;display:flex;flex-direction:column}
.main{flex:1;display:flex;flex-direction:column;background:#111}
.section{margin-bottom:16px}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#666;margin-bottom:8px}
.row{display:flex;gap:8px;margin-bottom:8px}
input,button{padding:8px 12px;border:1px solid #333;background:#222;color:#ccc;border-radius:3px;font-size:12px}
input:focus{outline:none;border-color:#555}
button{cursor:pointer;background:#333}
button:hover{background:#444}
button:disabled{opacity:0.4;cursor:default}
.label{font-size:11px;color:#777;margin-right:4px}
.status{font-size:10px;padding:3px 10px;border-radius:10px;background:#333;display:inline-block}
.status.on{background:#1a3a1a;color:#6a6}
.status.off{background:#3a1a1a;color:#a66}
.room-code{font-family:monospace;font-size:24px;letter-spacing:6px;color:#fff;margin:12px 0}
.panel{flex:1;display:flex;flex-direction:column;border:1px solid #333;margin:10px;border-radius:3px;overflow:hidden;min-height:0}
.panel-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#666;padding:8px 12px;background:#1a1a1a;border-bottom:1px solid #333}
.panel-content{flex:1;overflow:auto;background:#0d0d0d}
#chat{padding:12px;font-size:13px;line-height:1.6}
#chat .msg{margin-bottom:8px}
#chat .msg.you{color:#888}
#chat .msg.peer{color:#6a6}
.input-row{display:flex;gap:8px;padding:10px;border-top:1px solid #333;background:#1a1a1a}
.input-row input{flex:1}
select{background:#222;color:#ccc;border:1px solid #333;border-radius:3px}
</style>
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
</head>
<body>
<div class="wrap">
<div class="side">
<div class="section">
<div class="section-title">Backend</div>
<div class="row">
<input id="backend" value="ws://127.0.0.1:9999" style="flex:1">
</div>
<div class="row">
<button id="btnBackend">Connect</button>
<button id="btnGetBackend">Download</button>
</div>
<div class="row" style="align-items:center">
<span class="label">Status:</span> <span id="backendStatus" class="status off">offline</span>
</div>
<div style="font-size:9px;color:#555">python3 backend.py</div>
</div>

<div class="section">
<div class="section-title">Room</div>
<div class="row">
<input id="room" placeholder="CODE" maxlength="8" style="width:100px;text-transform:uppercase;text-align:center;font-family:monospace;font-size:14px">
<button id="btnJoin">Join</button>
<button id="btnNew">New</button>
</div>
<div id="roomInfo" style="display:none">
<div class="room-code" id="roomCode"></div>
</div>
<div class="row" style="margin-top:8px;align-items:center">
<span class="label">Signal:</span> <span id="status" class="status off">offline</span>
<span class="label" style="margin-left:12px">Peer:</span> <span id="peerStatus" class="status off">waiting</span>
</div>
</div>

<div class="section">
<div class="section-title">SOCKS Bridge</div>
<div class="row">
<button id="btnSocks" disabled style="flex:1;font-size:11px">EXE</button>
<button id="btnSocksPs" disabled style="flex:1;font-size:11px">PS1</button>
<button id="btnSocksPy" disabled style="flex:1;font-size:11px">PY</button>
<button id="btnBridge" style="flex:1;font-size:11px">Connect</button>
</div>
<div class="row" style="margin-top:6px;align-items:center">
<span class="label">Bridge:</span> <span id="socksStatus" class="status off">offline</span>
</div>
<div style="font-size:9px;color:#555;margin-top:4px">run bridge ROOM then click Connect</div>
</div>

<div class="section">
<div class="section-title">Port Forward</div>
<div class="row">
<button id="btnPortFwd" disabled style="flex:1;font-size:11px">Download</button>
</div>
<div style="font-size:9px;color:#555;margin-top:4px">server/client modes</div>
</div>

<div class="section">
<div class="section-title">Log</div>
<div id="log" style="height:50px;background:#0d0d0d;border:1px solid #333;border-radius:3px;padding:8px;overflow-y:auto;font-family:monospace;font-size:10px;color:#555"></div>
</div>
</div>

<div class="main">
<div class="panel">
<div class="panel-title">Chat</div>
<div class="panel-content" id="chat"></div>
<div class="input-row">
<input type="file" id="fileInput" style="display:none">
<button id="btnFile" disabled title="Send file">📎</button>
<input id="msg" placeholder="Type a message..." disabled>
<button id="btnSend" disabled>Send</button>
</div>
</div>

<div class="panel">
<div class="panel-title">cURL</div>
<div class="panel-content">
<pre id="httpOut" style="margin:0;padding:12px;font-size:11px;color:#6a6;white-space:pre-wrap;word-break:break-all"></pre>
</div>
<div class="input-row" style="flex-wrap:wrap">
<input id="curlCmd" placeholder="curl -X POST -H 'Content-Type: json' -d '{data}' -L -k http://example.com" disabled style="flex:1;min-width:200px;font-size:11px;font-family:monospace">
<button id="btnGo" disabled>Send</button>
<button id="btnCopy" disabled title="Copy command" style="font-size:10px">📋</button>
</div>
<div style="padding:4px 10px;font-size:9px;color:#555">-X method | -H header | -d data | -b cookies | -A agent | -L follow | -k insecure | --timeout N</div>
</div>
</div>
</div>

<script>
var room,ably,channel,backend,bridge,pending={},fid=0,myId,peerId=null,connected=false,fileChunks={};
var $=function(i){return document.getElementById(i)};
var log=function(m,c){var l=$('log');var d=document.createElement('div');d.style.color=c||'#555';d.textContent=m;l.appendChild(d);while(l.children.length>100)l.removeChild(l.firstChild);l.scrollTop=9999};
var setS=function(i,on,t){var e=$(i);e.className='status '+(on?'on':'off');e.textContent=t||(on?'online':'offline')};
var addChat=function(el){var c=$('chat');c.appendChild(el);while(c.children.length>500)c.removeChild(c.firstChild);c.scrollTop=9999};
setInterval(function(){var now=Date.now();for(var k in fileChunks){if(now-fileChunks[k].ts>60000){log('file transfer timeout: '+k,'#a66');delete fileChunks[k];}}},10000);

var backendAutoReconnect=false;
function connectBackend(){
if(backend&&backend.readyState===1){backendAutoReconnect=false;backend.close();return;}
backendAutoReconnect=true;
try{
log('connecting to '+$('backend').value+'...');
backend=new WebSocket($('backend').value);
backend.onopen=function(){log('backend connected','#6a6');setS('backendStatus',1,'online')};
backend.onerror=function(e){log('backend error','#a66');console.error(e)};
backend.onclose=function(){setS('backendStatus',0,'offline');backend=null;if(backendAutoReconnect){log('reconnecting in 3s...');setTimeout(connectBackend,3000);}};
backend.onmessage=function(e){
var m;try{m=JSON.parse(e.data);}catch(ex){log('invalid backend msg','#a66');return;}
if(m.type==='fetch_response'){
log('fetch response: '+(m.body?m.body.length+'b':'error'));
if(pending[m.id]){pending[m.id](m);delete pending[m.id];}
else if(channel&&peerId){
var body=m.body||'';
if(body.length>50000)body=body.substring(0,50000)+'<!--truncated-->';
channel.publish('data',{type:'response',from:myId,id:m.id,status:m.status,headers:m.headers,body:body,error:m.error});
}
}
else if(m.type==='connected'){
log('tcp connected: '+m.session);
if(channel)channel.publish('data',{type:'tcp_connected',from:myId,session:m.session});
sendToBridge({type:'tcp_connected',session:m.session});
}
else if(m.type==='data'){
var d=m.data;
if(d.length>40000){
for(var i=0;i<d.length;i+=40000){
var chunk=d.substring(i,i+40000);
if(channel)channel.publish('data',{type:'tcp_data',from:myId,session:m.session,data:chunk});
}
}else{
if(channel)channel.publish('data',{type:'tcp_data',from:myId,session:m.session,data:d});
}
sendToBridge({type:'tcp_data',session:m.session,data:m.data});
}
else if(m.type==='closed'){
log('tcp closed: '+m.session);
if(channel)channel.publish('data',{type:'tcp_closed',from:myId,session:m.session});
sendToBridge({type:'tcp_closed',session:m.session});
}
else if(m.type==='error'){
log('tcp error: '+m.msg,'#a66');
if(channel)channel.publish('data',{type:'tcp_error',from:myId,session:m.session,error:m.msg});
sendToBridge({type:'tcp_error',session:m.session,error:m.msg});
}
};
}catch(e){log('backend error','#a66')}
}

function setConnected(){
if(connected)return;
connected=true;
log('peer connected','#6a6');
setS('peerStatus',1,'connected');
$('msg').disabled=$('btnSend').disabled=$('btnFile').disabled=$('curlCmd').disabled=$('btnGo').disabled=$('btnCopy').disabled=$('btnSocks').disabled=$('btnSocksPs').disabled=$('btnSocksPy').disabled=$('btnPortFwd').disabled=false;
$('msg').focus();
tryConnectBridge();
}

var bridgeReconnectTimer=null;
function tryConnectBridge(){
if(bridgeReconnectTimer){clearTimeout(bridgeReconnectTimer);bridgeReconnectTimer=null;}
try{
log('trying local bridge...');
bridge=new WebSocket('ws://127.0.0.1:9998');
bridge.onopen=function(){
log('bridge connected!','#6a6');
setS('socksStatus',1,'online');
};
bridge.onclose=function(){
log('bridge closed - reconnecting in 3s...','#a66');
setS('socksStatus',0,'offline');
bridge=null;
bridgeReconnectTimer=setTimeout(tryConnectBridge,3000);
};
bridge.onerror=function(e){
bridge=null;
if(!bridgeReconnectTimer)bridgeReconnectTimer=setTimeout(tryConnectBridge,5000);
};
bridge.onmessage=function(e){
var m;try{m=JSON.parse(e.data);}catch(ex){return;}
if(m.type==='bridge_init'){
log('bridge room: '+m.room);
}else if(m.type==='tcp_connect'){
log('bridge tcp: '+m.host+':'+m.port);
if(channel&&peerId){
channel.publish('data',{type:'tcp_connect',from:myId,session:m.session,host:m.host,port:m.port});
}else if(backend&&backend.readyState===1){
backend.send(JSON.stringify({type:'connect',session:m.session,host:m.host,port:m.port}));
}
}else if(m.type==='tcp_data'){
if(channel&&peerId){
channel.publish('data',{type:'tcp_data',from:myId,session:m.session,data:m.data});
}else if(backend&&backend.readyState===1){
backend.send(JSON.stringify({type:'data',session:m.session,data:m.data}));
}
}else if(m.type==='tcp_close'){
if(channel&&peerId){
channel.publish('data',{type:'tcp_close',from:myId,session:m.session});
}else if(backend&&backend.readyState===1){
backend.send(JSON.stringify({type:'close',session:m.session}));
}
}
};
}catch(e){}
}

function sendToBridge(msg){
if(bridge&&bridge.readyState===1){
bridge.send(JSON.stringify(msg));
}
}

function joinRoom(code,isNew){
if(channel){try{channel.unsubscribe();}catch(e){}}
if(ably){try{ably.close();}catch(e){}}
room=code.toUpperCase();
myId=Array.from(crypto.getRandomValues(new Uint8Array(6))).map(b=>b.toString(36)).join('').substring(0,8);
connected=false;
peerId=null;
$('room').value=room;
$('roomCode').textContent=room;
$('roomInfo').style.display='block';
$('btnJoin').disabled=$('btnNew').disabled=true;

log('connecting...');

ably=new Ably.Realtime({
key:'gAgqHA.yZ5GzA:6o4_ysot75A7YNoDEicN23KmBcI3isDJL3uYIUp3Ibg',
clientId:myId
});

var subscribed=false;
ably.connection.on('connected',function(){
log('signal online','#6a6');
setS('status',1,'online');
if(subscribed)return;
subscribed=true;

channel=ably.channels.get('relay-'+room);
channel.subscribe(function(msg){
var d=msg.data;
if(!d||d.from===myId)return;

if(d.type==='hello'&&!connected){
peerId=d.from;
setConnected();
if(isNew)channel.publish('data',{type:'hello',from:myId});
}
else if(d.type==='bridge_hello'){
log('SOCKS bridge connected','#6a6');
setS('socksStatus',1,'online');
channel.publish('data',{type:'bridge_ack',from:myId});
}
else if(d.type==='chat'){
var div=document.createElement('div');div.className='msg peer';div.textContent=d.text;
addChat(div);
}
else if(d.type==='file'){
var div=document.createElement('div');div.className='msg peer';
var safeMime=(d.mime||'application/octet-stream').replace(/[^a-zA-Z0-9\/\-\+\.]/g,'');
var a=document.createElement('a');a.href='data:'+safeMime+';base64,'+d.data;
a.download=(d.name||'file').replace(/[^a-zA-Z0-9_\-\.]/g,'_');a.style.color='#6af';a.textContent=d.name||'file';
div.appendChild(document.createTextNode('📎 '));div.appendChild(a);div.appendChild(document.createTextNode(' ('+Math.round(d.size/1024)+'KB)'));
addChat(div);
}
else if(d.type==='file_chunk'){
if(!fileChunks[d.id])fileChunks[d.id]={chunks:[],meta:{name:d.name,mime:d.mime,size:d.size,total:d.total},ts:Date.now(),lastPct:0};
fileChunks[d.id].chunks[d.chunk]=d.data;fileChunks[d.id].ts=Date.now();
var recv=Object.keys(fileChunks[d.id].chunks).length;
var pct=Math.round((recv/d.total)*100);
if(recv===d.total){
var m=fileChunks[d.id].meta;
var b64=fileChunks[d.id].chunks.join('');
var div=document.createElement('div');div.className='msg peer';
var safeMime2=(m.mime||'application/octet-stream').replace(/[^a-zA-Z0-9\/\-\+\.]/g,'');
var a=document.createElement('a');a.href='data:'+safeMime2+';base64,'+b64;
a.download=(m.name||'file').replace(/[^a-zA-Z0-9_\-\.]/g,'_');a.style.color='#6af';a.textContent=m.name||'file';
div.appendChild(document.createTextNode('📎 '));div.appendChild(a);div.appendChild(document.createTextNode(' ('+Math.round(m.size/1024)+'KB)'));
addChat(div);
delete fileChunks[d.id];
log('✓ Received: '+m.name,'#6a6');
}else if(pct>=fileChunks[d.id].lastPct+10){
fileChunks[d.id].lastPct=pct;
log('⬇ '+d.name+': '+pct+'%','#fa6');
}
}
else if(d.type==='fetch'){
log('peer fetch: '+(d.method||'GET')+' '+d.url.substring(0,25));
if(backend&&backend.readyState===1){
backend.send(JSON.stringify({type:'fetch_request',id:d.id,url:d.url,method:d.method||'GET',headers:d.headers||'',body:d.body||''}));
}else{
channel.publish('data',{type:'response',from:myId,id:d.id,error:'no backend'});
}
}
else if(d.type==='response'){
log('got response');
if(pending[d.id]){pending[d.id](d);}
}
else if(d.type==='tcp_connect'){
log('tcp connect: '+d.host+':'+d.port);
if(backend&&backend.readyState===1){
backend.send(JSON.stringify({type:'connect',session:d.session,host:d.host,port:d.port}));
}else{
channel.publish('data',{type:'tcp_error',from:myId,session:d.session,error:'no backend'});
}
}
else if(d.type==='tcp_data'){
if(backend&&backend.readyState===1){
backend.send(JSON.stringify({type:'data',session:d.session,data:d.data}));
}
sendToBridge({type:'tcp_data',session:d.session,data:d.data});
}
else if(d.type==='tcp_close'){
if(backend&&backend.readyState===1){
backend.send(JSON.stringify({type:'close',session:d.session}));
}
}
else if(d.type==='tcp_connected'){
sendToBridge({type:'tcp_connected',session:d.session});
}
else if(d.type==='tcp_closed'){
sendToBridge({type:'tcp_closed',session:d.session});
}
else if(d.type==='tcp_error'){
sendToBridge({type:'tcp_error',session:d.session,error:d.error});
}
else if(d.type==='bridge_request'||d.type==='bridge_ps1_request'||d.type==='bridge_py_request'||d.type==='portfwd_request'){
var cfg={bridge_request:{file:'socks-bridge.txt',name:'bridge',bin:true},bridge_ps1_request:{file:'socks-bridge.ps1',name:'PS1',bin:false},bridge_py_request:{file:'socks-bridge.py',name:'PY',bin:false},portfwd_request:{file:'port-forward.txt',name:'port-forward',bin:true}}[d.type];
log('peer wants '+cfg.name+'...');
fetch(cfg.file+'?t='+Date.now(),{cache:'no-store'}).then(function(r){
if(!r.ok)throw new Error('HTTP '+r.status);
return cfg.bin?r.arrayBuffer():r.text();
}).then(function(data){
var b64;
if(cfg.bin){
var pad=new Uint8Array(256);for(var p=0;p<256;p++)pad[p]=Math.floor(Math.random()*256);
var combined=new Uint8Array(data.byteLength+256);combined.set(new Uint8Array(data),0);combined.set(pad,data.byteLength);
var s='';for(var i=0;i<combined.length;i++)s+=String.fromCharCode(combined[i]);b64=btoa(s);
}else{b64=btoa(data);}
var chunkSize=40000,total=Math.ceil(b64.length/chunkSize);
log('sending '+total+' chunks ('+Math.round((cfg.bin?data.byteLength:data.length)/1024)+'KB)');
var sendChunk=function(c){
if(c>=total)return;
channel.publish('data',{type:'response',from:myId,id:d.id,chunk:c,total:total,data:b64.substring(c*chunkSize,(c+1)*chunkSize)});
setTimeout(function(){sendChunk(c+1)},150);
};
sendChunk(0);
}).catch(function(e){
log(cfg.name+' error: '+e.message,'#a66');
channel.publish('data',{type:'response',from:myId,id:d.id,error:e.message});
});
}
});

channel.on('attached',function(){
if(isNew){
log('waiting for peer...');
setS('peerStatus',0,'waiting');
}else{
log('joining room...');
channel.publish('data',{type:'hello',from:myId});
}
});
});

ably.connection.on('failed',function(){log('connection failed','#a66');setS('status',0,'failed');setTimeout(function(){log('retrying...');joinRoom(room,false);},5000);});
ably.connection.on('closed',function(){log('connection closed','#a66');setS('status',0,'closed');});
// Heartbeat to detect dead peer connections
setInterval(function(){
if(channel&&connected&&peerId){
channel.publish('data',{type:'ping',from:myId});
}
},30000);
ably.connection.on('disconnected',function(){log('signal disconnected, reconnecting...','#a66');setS('status',0,'reconnecting')});
ably.connection.on('suspended',function(){log('signal suspended','#a66');setS('status',0,'suspended')});
}

function sendChat(){
var t=$('msg').value.trim();
if(!t||!channel||!peerId)return;
channel.publish('data',{type:'chat',from:myId,text:t});
var div=document.createElement('div');div.className='msg you';div.textContent=t;
addChat(div);
$('msg').value='';
}

function parseCurl(cmd){
cmd=cmd.trim();if(cmd.startsWith('curl '))cmd=cmd.substring(5);
var o={method:'GET',headers:[],body:'',cookies:'',userAgent:'',follow:false,insecure:false,verbose:false,timeout:30,url:''};
var tokens=[],cur='',inQ=false,qc='';
for(var i=0;i<cmd.length;i++){
var c=cmd[i];
if(inQ){if(c===qc){inQ=false;}else{cur+=c;}}
else if(c==='"'||c==="'"){inQ=true;qc=c;}
else if(c===' '){if(cur){tokens.push(cur);cur='';}}
else{cur+=c;}
}
if(cur)tokens.push(cur);
for(var i=0;i<tokens.length;i++){
var t=tokens[i],n=tokens[i+1]||'';
if(t==='-X'||t==='--request'){o.method=n.toUpperCase();i++;}
else if(t==='-H'||t==='--header'){o.headers.push(n);i++;}
else if(t==='-d'||t==='--data'||t==='--data-raw'){o.body=n;i++;}
else if(t==='-b'||t==='--cookie'){o.cookies=n;i++;}
else if(t==='-A'||t==='--user-agent'){o.userAgent=n;i++;}
else if(t==='-L'||t==='--location'){o.follow=true;}
else if(t==='-k'||t==='--insecure'){o.insecure=true;}
else if(t==='-v'||t==='--verbose'){o.verbose=true;}
else if(t==='--timeout'||t==='--connect-timeout'){o.timeout=parseInt(n)||30;i++;}
else if(t.startsWith('http')||t.startsWith('//')){o.url=t;}
else if(!t.startsWith('-')&&!o.url){o.url=t;}
}
if(!o.url)return null;
if(!o.url.startsWith('http'))o.url='http://'+o.url;
return o;
}
function buildCurlCmd(o){
if(!o)return'';
var cmd='curl';
if(o.insecure)cmd+=' -k';
if(o.follow)cmd+=' -L';
if(o.verbose)cmd+=' -v';
if(o.method!=='GET')cmd+=' -X '+o.method;
if(o.timeout&&o.timeout!==30)cmd+=' --timeout '+o.timeout;
if(o.userAgent)cmd+=" -A '"+o.userAgent.replace(/'/g,"'\\''")+"'";
if(o.cookies)cmd+=" -b '"+o.cookies.replace(/'/g,"'\\''")+"'";
o.headers.forEach(function(h){if(h)cmd+=" -H '"+h.replace(/'/g,"'\\''")+"'";});
if(o.body)cmd+=" -d '"+o.body.replace(/'/g,"'\\''")+"'";
cmd+=" '"+o.url+"'";
return cmd;
}
function browse(){
var o=parseCurl($('curlCmd').value);if(!o)return;
$('httpOut').textContent=buildCurlCmd(o)+'\n\nLoading...';
$('httpOut').style.color='#666';
log(o.method+': '+o.url.substring(0,30));

var id='f'+(fid++);
var done=false;
var tms=(o.timeout||30)*1000+5000;
var tmr=setTimeout(function(){if(!done){done=true;delete pending[id];$('httpOut').textContent='ERROR: Request timeout';$('httpOut').style.color='#a66';log('request timeout','#a66');}},tms);

pending[id]=function(r){
if(done)return;done=true;clearTimeout(tmr);
var cmd=buildCurlCmd(o)+'\n\n';
if(r.error){
$('httpOut').textContent=cmd+'ERROR: '+r.error;
$('httpOut').style.color='#a66';
}else{
var out=cmd+'HTTP '+(r.status||'?')+'\n';
if(r.headers)out+=r.headers+'\n';
out+='\n'+(r.body||'');
$('httpOut').textContent=out;
$('httpOut').style.color='#6a6';
}
};

if(backend&&backend.readyState===1){
var req={type:'fetch_request',id:id,url:o.url,method:o.method,timeout:o.timeout,follow:o.follow,insecure:o.insecure};
if(o.headers.length)req.headers=o.headers.join(',');
if(o.cookies)req.cookies=o.cookies;
if(o.userAgent)req.userAgent=o.userAgent;
if(o.body)req.body=o.body;
backend.send(JSON.stringify(req));
}else if(channel&&peerId){
log('fetch via peer...');
var msg={type:'fetch',from:myId,id:id,url:o.url,method:o.method,timeout:o.timeout,follow:o.follow,insecure:o.insecure};
if(o.headers.length)msg.headers=o.headers.join(',');
if(o.cookies)msg.cookies=o.cookies;
if(o.userAgent)msg.userAgent=o.userAgent;
if(o.body)msg.body=o.body;
channel.publish('data',msg);
}else{
$('httpOut').textContent='Not connected';
$('httpOut').style.color='#a66';
}
}

$('fileInput').onchange=function(){
var f=this.files[0];if(!f||!channel||!peerId)return;
if(f.size>1024*1024*1024){alert('Max file size: 1GB');return;}
var r=new FileReader();
r.onload=function(){
var b64=r.result.split(',')[1];
var chunkSize=10000;
if(b64.length<=chunkSize){
channel.publish('data',{type:'file',from:myId,name:f.name,mime:f.type||'application/octet-stream',size:f.size,data:b64});
}else{
var fileId='f'+Date.now();
var total=Math.ceil(b64.length/chunkSize);
var sizeKB=Math.round(f.size/1024);
log('⬆ Sending: '+f.name+' ('+sizeKB+'KB, '+total+' chunks)','#6af');
var lastPct=0;
var sendChunk=function(c){
if(c>=total){log('✓ Sent: '+f.name,'#6a6');return;}
var data=b64.substring(c*chunkSize,(c+1)*chunkSize);
channel.publish('data',{type:'file_chunk',from:myId,id:fileId,name:f.name,mime:f.type||'application/octet-stream',size:f.size,chunk:c,total:total,data:data});
var pct=Math.round((c/total)*100);
if(pct>=lastPct+10){lastPct=pct;log('⬆ '+f.name+': '+pct+'%','#6af');}
setTimeout(function(){sendChunk(c+1)},75);
};
sendChunk(0);
}
var div=document.createElement('div');div.className='msg you';div.textContent='📎 '+f.name+' ('+Math.round(f.size/1024)+'KB) sent';
addChat(div);
};
r.readAsDataURL(f);
$('fileInput').value='';
};

function downloadViaPeer(reqType,fname,isBin,msg){
if(!channel||!peerId){log('not connected','#a66');return;}
var rnd=Math.random().toString(36).substring(2,8);
fname=fname.replace('RND',rnd);
log(msg);
var id='dl'+(fid++),chunks=[],lastT=Date.now(),tmr=null,done=false;
function chkTimeout(){
if(done)return;
if(Date.now()-lastT>30000){log('timeout - no data 30s','#a66');delete pending[id];done=true;return;}
tmr=setTimeout(chkTimeout,5000);
}
tmr=setTimeout(chkTimeout,5000);
pending[id]=function(r){
if(done)return;
if(r.error){log('failed: '+r.error,'#a66');clearTimeout(tmr);done=true;return;}
if(r.chunk!==undefined){
chunks[r.chunk]=r.data;lastT=Date.now();
var pct=Math.round((Object.keys(chunks).length/r.total)*100);
log('downloading '+pct+'% ('+Object.keys(chunks).length+'/'+r.total+')');
if(Object.keys(chunks).length===r.total){
clearTimeout(tmr);done=true;
var b64=chunks.join(''),bin=atob(b64),blob;
if(isBin){var arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);blob=new Blob([arr],{type:'application/octet-stream'});}
else{blob=new Blob([bin],{type:'text/plain'});}
var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;
document.body.appendChild(a);a.click();document.body.removeChild(a);
log('saved '+fname+' ('+Math.round(blob.size/1024)+'KB)'+(isBin?' - rename to .exe':''),'#6a6');
delete pending[id];
}}};
channel.publish('data',{type:reqType,from:myId,id:id});
}
