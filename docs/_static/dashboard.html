<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Relay</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:#1a1a1a;color:#ccc;font-size:13px;padding:15px}
.section{background:#222;padding:15px;border-radius:4px;margin-bottom:15px;max-width:500px}
.title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#666;margin-bottom:10px}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
input,button,textarea{padding:8px;border:1px solid #333;background:#111;color:#ccc;border-radius:3px;font-size:13px}
button{cursor:pointer;background:#333;min-width:80px}
button:hover{background:#444}
.code{font-family:monospace;font-size:18px;letter-spacing:3px;color:#fff;background:#000;padding:12px;border-radius:3px;text-align:center;cursor:pointer;user-select:all}
.status{color:#6a6}
.error{color:#a66}
#log{background:#000;padding:10px;font-family:monospace;font-size:11px;height:150px;overflow-y:auto;border-radius:3px}
.help{font-size:11px;color:#666;margin-top:8px}
</style>
</head>
<body>

<div class="section">
<div class="title">Step 1: Choose Role</div>
<div class="row">
<button id="btnVM">I'm the VM (Create)</button>
<button id="btnHost">I'm the Host (Join)</button>
</div>
</div>

<div id="vmPanel" style="display:none">
<div class="section">
<div class="title">Step 2: Share this code with Host</div>
<div class="code" id="vmCode" onclick="copy('vmCode')">Generating...</div>
<div class="help">Click to copy. Tell Host to type this.</div>
</div>
<div class="section">
<div class="title">Step 3: Enter Host's code</div>
<input id="hostReply" placeholder="Host's code" style="width:100%;font-family:monospace;font-size:16px">
<button id="btnVMConnect" style="margin-top:8px;width:100%">Connect</button>
</div>
</div>

<div id="hostPanel" style="display:none">
<div class="section">
<div class="title">Step 2: Enter VM's code</div>
<input id="vmInput" placeholder="VM's code" style="width:100%;font-family:monospace;font-size:16px">
<button id="btnHostAccept" style="margin-top:8px;width:100%">Accept</button>
</div>
<div class="section">
<div class="title">Step 3: Share this code with VM</div>
<div class="code" id="hostCode">Waiting...</div>
<div class="help">Click to copy. Tell VM to type this.</div>
</div>
</div>

<div class="section">
<div class="title">Status</div>
<div id="statusText">Not connected</div>
</div>

<div class="section">
<div class="title">Chat (after connected)</div>
<div class="row">
<input id="msg" placeholder="message" style="flex:1" disabled>
<button id="btnSend" disabled>Send</button>
</div>
<div id="chat" style="background:#000;padding:8px;margin-top:8px;min-height:60px;border-radius:3px"></div>
</div>

<div class="section">
<div class="title">Log</div>
<div id="log"></div>
</div>

<script>
var pc,dc;
var log=function(m,c){document.getElementById('log').innerHTML+='<div style="color:'+(c||'#666')+'">'+m+'</div>';document.getElementById('log').scrollTop=9999};
var status=function(m,ok){document.getElementById('statusText').innerHTML='<span class="'+(ok?'status':'error')+'">'+m+'</span>'};

function copy(id){
    var t=document.getElementById(id).textContent;
    if(t&&t.indexOf('...')<0){navigator.clipboard.writeText(t);log('Copied!','#6a6')}
}

// Extract minimal key from SDP: ufrag + pwd + fingerprint_short
function toKey(sdp){
    var u='',p='',f='';
    sdp.split('\n').forEach(function(l){
        if(l.indexOf('a=ice-ufrag:')===0)u=l.substr(12).trim();
        if(l.indexOf('a=ice-pwd:')===0)p=l.substr(10).trim();
        if(l.indexOf('a=fingerprint:')===0){
            var parts=l.split(' ');
            if(parts[1])f=parts[1].replace(/:/g,'').substr(0,24);
        }
    });
    return u+'-'+p+'-'+f;
}

// Rebuild SDP from key
function fromKey(key,type){
    var parts=key.split('-');
    if(parts.length<3){log('Invalid key format','#a66');return null}
    var u=parts[0],p=parts[1],f=parts.slice(2).join('-');
    // Pad fingerprint
    while(f.length<64)f+='0';
    var fStr=f.match(/.{2}/g).join(':');
    
    var sdp='v=0\r\no=- '+Date.now()+' 2 IN IP4 127.0.0.1\r\ns=-\r\nt=0 0\r\n';
    sdp+='a=group:BUNDLE 0\r\na=extmap-allow-mixed\r\na=msid-semantic: WMS\r\n';
    sdp+='m=application 9 UDP/DTLS/SCTP webrtc-datachannel\r\nc=IN IP4 0.0.0.0\r\n';
    sdp+='a=ice-ufrag:'+u+'\r\na=ice-pwd:'+p+'\r\n';
    sdp+='a=ice-options:trickle\r\na=fingerprint:sha-256 '+fStr+'\r\n';
    sdp+='a=setup:'+(type==='offer'?'actpass':'active')+'\r\na=mid:0\r\na=sctp-port:5000\r\na=max-message-size:262144\r\n';
    return sdp;
}

function createPC(){
    pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});
    pc.onicecandidate=function(e){if(e.candidate)log('ICE: '+e.candidate.candidate.substr(10,40)+'...')};
    pc.onconnectionstatechange=function(){
        log('Connection: '+pc.connectionState);
        if(pc.connectionState==='connected'){
            status('Connected!',true);
            document.getElementById('msg').disabled=false;
            document.getElementById('btnSend').disabled=false;
        }else if(pc.connectionState==='failed'){
            status('Failed - fingerprints may not match',false);
        }
    };
    pc.ondatachannel=function(e){dc=e.channel;setupDC()};
}

function setupDC(){
    dc.onopen=function(){log('Data channel open','#6a6')};
    dc.onmessage=function(e){
        try{var d=JSON.parse(e.data);if(d.type==='chat')document.getElementById('chat').innerHTML+='<div>peer: '+d.text+'</div>'}catch(x){}
    };
}

// VM creates offer
document.getElementById('btnVM').onclick=function(){
    document.getElementById('vmPanel').style.display='block';
    document.getElementById('hostPanel').style.display='none';
    createPC();
    dc=pc.createDataChannel('data');
    setupDC();
    pc.createOffer().then(function(o){return pc.setLocalDescription(o)}).then(function(){
        var key=toKey(pc.localDescription.sdp);
        document.getElementById('vmCode').textContent=key;
        log('Offer ready ('+key.length+' chars)');
        log('Share this code with Host');
    });
};

// VM connects with Host's answer
document.getElementById('btnVMConnect').onclick=function(){
    var key=document.getElementById('hostReply').value.trim();
    if(!key){log('Enter Host code','#a66');return}
    var sdp=fromKey(key,'answer');
    if(!sdp)return;
    log('Setting answer...');
    pc.setRemoteDescription({type:'answer',sdp:sdp}).then(function(){
        log('Answer set, waiting for connection...');
        status('Connecting...',true);
    }).catch(function(e){log('Error: '+e,'#a66')});
};

// Host accepts VM's offer
document.getElementById('btnHost').onclick=function(){
    document.getElementById('hostPanel').style.display='block';
    document.getElementById('vmPanel').style.display='none';
    log('Ready - enter VM code');
};

document.getElementById('btnHostAccept').onclick=function(){
    var key=document.getElementById('vmInput').value.trim();
    if(!key){log('Enter VM code','#a66');return}
    createPC();
    var sdp=fromKey(key,'offer');
    if(!sdp)return;
    log('Setting offer...');
    pc.setRemoteDescription({type:'offer',sdp:sdp}).then(function(){
        return pc.createAnswer();
    }).then(function(a){
        return pc.setLocalDescription(a);
    }).then(function(){
        var ansKey=toKey(pc.localDescription.sdp);
        document.getElementById('hostCode').textContent=ansKey;
        log('Answer ready ('+ansKey.length+' chars)');
        log('Share this code with VM');
        status('Waiting for VM to connect...',true);
    }).catch(function(e){log('Error: '+e,'#a66')});
};

// Chat
document.getElementById('btnSend').onclick=function(){
    var m=document.getElementById('msg').value.trim();
    if(m&&dc&&dc.readyState==='open'){
        dc.send(JSON.stringify({type:'chat',text:m}));
        document.getElementById('chat').innerHTML+='<div style="color:#888">you: '+m+'</div>';
        document.getElementById('msg').value='';
    }
};
document.getElementById('msg').onkeypress=function(e){if(e.key==='Enter')document.getElementById('btnSend').click()};

log('Click "I\'m the VM" or "I\'m the Host" to start');
</script>
</body>
</html>
